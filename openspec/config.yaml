schema: spec-driven

context: |
  Project: Void (macOS Native Clipboard Manager & Productivity Hub)
  Goal: A 100% feature-complete and UI/UX-faithful local macOS clone of Paste for Mac (Paste 6 / pasteapp.io).
  Target Platform: macOS 15+ / macOS 26+ (Apple Silicon & Intel, native Swift 6, SwiftUI + AppKit NSPanel with Liquid Glass visual design).
  Storage & Privacy: Local-first SQLite + FTS5 / SwiftData storage in ~/Library/Application Support/Void/ with local file/image asset cache, Vision OCR indexing, LinkPresentation metadata fetching, confidential/transient pasteboard filtering, app exclusion rules, and screen-sharing invisibility option.
  Core Subsystems:
  1. UI Shell & Panel (ui-shell-and-panel): Bottom-anchored sliding horizontal Liquid Glass panel (NSPanel), resizable & compact modes, menu bar status item, rich color-coded clipboard cards, horizontal scrolling & keyboard navigation.
  2. Clipboard Capture Engine (clipboard-capture-engine): NSPasteboard monitoring (text, RTF, HTML, code, URLs, images, files/folders, hex/RGB colors), rich link previews, on-device Vision OCR, Continuity Camera import, manual item creation (Cmd+N), privacy filters (ConcealedType/TransientType/AutoGeneratedType), excluded apps, pause capture (Cmd+T).
  3. Pinboards & Organization (pinboards-and-organization): Custom color-coded pinboards, tab navigation, drag-and-drop pinning & card reordering, multi-select bulk operations, retention immunity, local pinboard export/import.
  4. Power Search & Filters (power-search-and-filters): Instant type-to-search, full-text & inside-image OCR search, inline smart filter chips (Content Type, Source App, Date Range, Pinboard), search suggestions, Jump to History / Show in Pinboard (Cmd+G).
  5. Pasting & Paste Stack (pasting-and-paste-stack): Direct Paste to active app via Accessibility / CGEvent, clipboard fallback, Paste as Plain Text (Shift+Return), Quick Paste (Cmd+1..9), multi-item paste, drag-and-drop images as files, Paste Stack floating queue (Shift+Cmd+C) with FIFO/LIFO toggle.
  6. Item Preview & Editing (item-preview-and-editing): Quick Look / Space rich preview (text/code syntax highlighting, interactive web view, media player, PDF viewer), in-place text/URL editor (Cmd+E), custom card title/rename (Cmd+R), image rotation & OCR text extraction, interactive Color Picker, Apple Intelligence Writing Tools integration.
  7. Intelligent Clipboard & MCP Server (intelligent-clipboard-and-mcp): Context-aware Intelligent Clipboard suggestions based on active app/screen context, built-in local Model Context Protocol (MCP) server (HTTP/SSE + stdio bridge with bearer token auth), MCP tools for searching/reading/saving clipboard items and managing pinboards, one-click setup guides & approval manager for Claude Desktop, Claude Code, Codex, Cursor, VS Code, Windsurf, and Custom MCP clients.
  8. Settings, Storage & System Integration (settings-storage-and-shortcuts): Multi-tab Settings window (General, Shortcuts, Privacy/Rules, Intelligence, Sync/Backup), configurable history retention (1 Day, 1 Week, 1 Month, 1 Year, Forever) + Erase History, customizable global shortcuts & modifiers, Undo (Cmd+Z), and macOS App Intents / Shortcuts actions.

rules:
  proposal:
    - Clearly articulate the scope, capabilities, and architectural impact of Void as a complete local macOS clone of Paste.
  specs:
    - Every capability spec MUST include a ## Purpose section (>= 50 characters) and ## ADDED Requirements (for delta specs) or ## Requirements (for main specs).
    - Every requirement header MUST follow ### Requirement: <Name> with a concise normative description (<= 500 characters) using SHALL or MUST.
    - Every requirement MUST include one or more #### Scenario: <Name> blocks using WHEN and THEN bullets.
  design:
    - Detail the native macOS architecture (AppKit NSPanel + SwiftUI, PasteboardMonitor, SQLite FTS5 store, Vision OCR pipeline, CGEvent direct paster, local MCP server, App Intents).
  tasks:
    - Organize implementation into ordered phases with verifiable checkboxes (- [ ] X.Y ...).
